components:
  schemas:
    AIBehaviorPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        default_provider:
          $ref: '#/components/schemas/DefaultProviderEnum'
        fallback_provider:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/FallbackProviderEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        default_sales_model:
          type: string
          maxLength: 120
        default_support_model:
          type: string
          maxLength: 120
        max_context_messages:
          type: integer
          maximum: 200
          minimum: 1
        temperature_sales:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        temperature_support:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        auto_reply_enabled:
          type: boolean
        human_handoff_required_for_risks:
          type: boolean
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
    AIEvalResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        suite_name:
          type: string
          readOnly: true
        case_key:
          type: string
          readOnly: true
        provider:
          type: string
          readOnly: true
        model:
          type: string
          readOnly: true
        actual_output:
          readOnly: true
          nullable: true
        passed:
          type: boolean
          readOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
          readOnly: true
        metrics:
          readOnly: true
        error_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actual_output
      - case_key
      - created_at
      - error_message
      - id
      - metrics
      - model
      - passed
      - provider
      - score
      - suite_name
    AIMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/AIMessageRoleEnum'
          readOnly: true
        content:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        token_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - content_type
      - created_at
      - id
      - role
      - token_count
    AIMessageRoleEnum:
      enum:
      - system
      - developer
      - user
      - assistant
      - tool
      type: string
      description: |-
        * `system` - System
        * `developer` - Developer
        * `user` - User
        * `assistant` - Assistant
        * `tool` - Tool
    AIModelConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        provider:
          type: string
          format: uuid
        provider_type:
          type: string
          readOnly: true
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        model_name:
          type: string
          maxLength: 120
        temperature:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        max_tokens:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        timeout_seconds:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        fallback_model:
          type: string
          maxLength: 120
        fallback_provider:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        supports_tools:
          type: boolean
        supports_structured_outputs:
          type: boolean
        supports_audio:
          type: boolean
        supports_images:
          type: boolean
        supports_embeddings:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - model_name
      - provider
      - provider_type
      - purpose
    AIPrompt:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          maxLength: 120
        name:
          type: string
          maxLength: 255
        description:
          type: string
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        active_version:
          allOf:
          - $ref: '#/components/schemas/AIPromptVersion'
          readOnly: true
