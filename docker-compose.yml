services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_crm}
      POSTGRES_USER: ${POSTGRES_USER:-ai_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_crm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ai_crm} -d ${POSTGRES_DB:-ai_crm}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
